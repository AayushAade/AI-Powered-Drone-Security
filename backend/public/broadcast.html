<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Drone Broadcaster</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: #fff;
      font-family: 'Courier New', monospace;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    #localVideo {
      width: 100%;
      flex: 1;
      object-fit: cover;
      background: #111;
    }
    .hud {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 12px 16px;
      padding-top: max(env(safe-area-inset-top), 16px);
      background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
      z-index: 10;
    }
    .hud h1 { font-size: 14px; color: #0f0; letter-spacing: 2px; }
    .hud .status { font-size: 11px; margin-top: 4px; }
    .hud .status.connected { color: #0f0; }
    .hud .status.disconnected { color: #f55; }
    .hud .status.streaming { color: #0ff; }
    .controls {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 16px;
      padding-bottom: max(env(safe-area-inset-bottom), 20px);
      background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
      text-align: center;
      z-index: 10;
    }
    #startBtn {
      background: #34C759;
      color: #fff;
      border: none;
      padding: 16px 48px;
      font-size: 16px;
      font-weight: bold;
      font-family: 'Courier New', monospace;
      letter-spacing: 2px;
      border-radius: 30px;
      cursor: pointer;
      width: 90%;
    }
    #startBtn.active {
      background: #FF3B30;
    }
    .live-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #f00;
      animation: pulse 1s infinite;
      margin-right: 6px;
      vertical-align: middle;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    #overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 5;
      pointer-events: none;
    }
    .hud .status.ai { color: #ff0; }
  </style>
  <script src="/socket.io/socket.io.js"></script>
  <!-- Edge AI: TensorFlow.js & COCO-SSD -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
</head>
<body>
  <video id="localVideo" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>

  <div class="hud">
    <h1>🛩️ DRONE CAM — BROADCASTER (Edge AI)</h1>
    <div id="socketStatus" class="status disconnected">⚫ Not connected</div>
    <div id="rtcStatus" class="status">WebRTC: Idle</div>
    <div id="aiStatus" class="status ai">🧠 AI: Loading model...</div>
  </div>

  <div class="controls">
    <button id="startBtn" onclick="toggleBroadcast()" disabled>⏳ LOADING AI...</button>
  </div>

  <script>
    const ICE_SERVERS = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
      ]
    };

    let socket = null;
    let localStream = null;
    let broadcasting = false;
    let model = null;
    let detectionFrameId = null;
    let frameInterval = null;
    let lastAlertTime = 0;

    const video = document.getElementById('localVideo');
    const canvas = document.getElementById('overlay');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    const socketStatusEl = document.getElementById('socketStatus');
    const aiStatusEl = document.getElementById('aiStatus');

    // Load Edge AI model on startup
    cocoSsd.load().then(loadedModel => {
      model = loadedModel;
      aiStatusEl.innerText = '🧠 AI: Model Ready';
      startBtn.disabled = false;
      startBtn.innerText = '▶ START DRONE MISSION';
    }).catch(err => {
      aiStatusEl.innerText = '❌ AI: Failed to load';
      console.error(err);
    });

    function setSocketStatus(text, cls) {
      socketStatusEl.textContent = text;
      socketStatusEl.className = 'status ' + cls;
    }

    async function toggleBroadcast() {
      if (broadcasting) {
        stopBroadcast();
      } else {
        await startBroadcast();
      }
    }

    async function startBroadcast() {
      startBtn.disabled = true;
      startBtn.textContent = '⏳ INITIALIZING...';

      // 1. Get camera stream
      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 640 }, // Lower res for higher socket FPS
            height: { ideal: 480 },
          },
          audio: false,
        });
        video.srcObject = localStream;
        
        video.onloadedmetadata = () => {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          startDetection();
        };

      } catch (e) {
        console.error('[Camera] ❌ Failed:', e);
        alert('SECURITY ERROR: Mobile browsers require HTTPS to access the camera on a local network. Please check the terminal for HTTPS setup instructions.');
        startBtn.disabled = false;
        startBtn.textContent = '▶ RETRY MISSION';
        return;
      }

      // 2. Connect to backend
      socket = io(window.location.origin, { transports: ['websocket'] });

      socket.on('connect', () => {
        setSocketStatus('🟢 Uplink Active (Port 3443)', 'connected');
        
        // 3. START BASE64 FRAME EMISSION LOOP (5 FPS)
        const frameCanvas = document.createElement('canvas');
        const fCtx = frameCanvas.getContext('2d');
        
        frameInterval = setInterval(() => {
          if (video.readyState === video.HAVE_ENOUGH_DATA) {
            frameCanvas.width = 320; // Downscale further for speed
            frameCanvas.height = 240;
            fCtx.drawImage(video, 0, 0, frameCanvas.width, frameCanvas.height);
            const base64 = frameCanvas.toDataURL('image/jpeg', 0.5); // 50% quality
            
            socket.emit('video_frame', { 
              image: base64.split(',')[1], // Just the data
              drone_id: 'D-Alpha'
            });
          }
        }, 200); // 5 FPS
      });

      socket.on('disconnect', () => {
        setSocketStatus('🔴 Uplink Offline', 'disconnected');
      });

      // 4. Start Location Tracking
      if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition((pos) => {
          if (socket && socket.connected) {
            socket.emit('telemetry_update', {
              drone_id: 'D-Alpha',
              lat: pos.coords.latitude,
              lng: pos.coords.longitude
            });
          }
        });
      }

      broadcasting = true;
      startBtn.classList.add('active');
      startBtn.disabled = false;
      startBtn.innerHTML = '<span class="live-dot"></span> STOP MISSION';
    }

    async function startDetection() {
      if (!model || !broadcasting) return;

      const predictions = await model.detect(video);
      
      const drawWidth = video.clientWidth;
      const drawHeight = video.clientHeight;
      canvas.width = drawWidth;
      canvas.height = drawHeight;
      const scaleX = drawWidth / video.videoWidth;
      const scaleY = drawHeight / video.videoHeight;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.font = '14px Courier New';
      ctx.lineWidth = 2;

      let personDetected = false;

      predictions.forEach(prediction => {
        if (prediction.class === 'person' && prediction.score > 0.5) {
          personDetected = true;
          const [x, y, width, height] = prediction.bbox;
          ctx.strokeStyle = '#FF3B30';
          ctx.strokeRect(x * scaleX, y * scaleY, width * scaleX, height * scaleY);
          ctx.fillStyle = '#FF3B30';
          ctx.fillText(`HUMAN ${Math.round(prediction.score * 100)}%`, x * scaleX, (y * scaleY) - 5);
        }
      });

      const now = Date.now();
      if (personDetected && (now - lastAlertTime > 5000)) {
        aiStatusEl.innerText = '🚨 AI: TARGET DETECTED';
        aiStatusEl.style.color = '#f00';
        lastAlertTime = now;
      } else if (!personDetected && (now - lastAlertTime > 2000)) {
         aiStatusEl.innerText = '🧠 AI: Scanning...';
         aiStatusEl.style.color = '#ff0';
      }

      detectionFrameId = requestAnimationFrame(startDetection);
    }

    function stopBroadcast() {
      if (detectionFrameId) cancelAnimationFrame(detectionFrameId);
      if (frameInterval) clearInterval(frameInterval);
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
        localStream = null;
        video.srcObject = null;
      }
      if (socket) { socket.disconnect(); socket = null; }
      
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      broadcasting = false;
      startBtn.classList.remove('active');
      startBtn.textContent = '▶ START DRONE MISSION';
      setSocketStatus('⚫ Not connected', 'disconnected');
      aiStatusEl.innerText = '🧠 AI: Model Ready';
      aiStatusEl.style.color = '#ff0';
    }
  </script>
</body>
</html>
  </script>
</body>
</html>
